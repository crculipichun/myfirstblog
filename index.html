<style>
/* Layout: una columna tipo app (máx. 640px), cabecera fija arriba, barra de pestañas abajo. Neutros pizarra, acento amarillo alta visibilidad. */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --ink: #16202b;
  --muted: #5a6776;
  --line: #d3dae2;
  --accent: #f2a900;
  --accent-ink: #1d1500;
  --bar: #16202b;
  --bar-ink: #e9eef3;
  --bar-muted: #93a1b1;
  --ok: #1d7f47;
  --ok-bg: #e2f3e9;
  --warn: #9a5c00;
  --warn-bg: #fdf0d6;
  --bad: #b8282a;
  --bad-bg: #fbe3e2;
  --info: #2b5c8f;
  --info-bg: #e2ecf6;
  --plate-bg: #ffffff;
  --plate-ink: #111111;
  --shadow: 0 1px 2px rgba(22,32,43,.08), 0 2px 8px rgba(22,32,43,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141b; --surface: #17202a; --surface-2: #1d2833; --ink: #e6ecf2; --muted: #95a3b3; --line: #2a3643;
    --accent: #ffb81c; --accent-ink: #1d1500; --bar: #0a0f15; --bar-ink: #e6ecf2; --bar-muted: #8494a6;
    --ok: #4cc785; --ok-bg: #12301f; --warn: #f2ab45; --warn-bg: #352610; --bad: #f2716d; --bad-bg: #3a1716;
    --info: #7db3ea; --info-bg: #142a40; --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #17202a; --surface-2: #1d2833; --ink: #e6ecf2; --muted: #95a3b3; --line: #2a3643;
  --accent: #ffb81c; --accent-ink: #1d1500; --bar: #0a0f15; --bar-ink: #e6ecf2; --bar-muted: #8494a6;
  --ok: #4cc785; --ok-bg: #12301f; --warn: #f2ab45; --warn-bg: #352610; --bad: #f2716d; --bad-bg: #3a1716;
  --info: #7db3ea; --info-bg: #142a40; --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bar); color: var(--bar-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand { font: 700 22px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 26px; height: 26px; flex: none; }
.mode { margin-left: auto; font-size: 12px; color: var(--bar-muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.mode::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--bar-muted); }
.mode.shared::before { background: #4cc785; }
.mode.local::before { background: var(--accent); }

main {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 20px;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 30px; letter-spacing: .01em; }
h2 { font-size: 21px; text-transform: uppercase; letter-spacing: .04em; }
h3 { font-size: 19px; }
.eyebrow { font: 600 12px/1 var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
section { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.list { display: grid; }
.list > * + * { border-top: 1px solid var(--line); }

/* Patente chilena */
.plate {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--plate-bg); color: var(--plate-ink); border: 2px solid var(--plate-ink); border-radius: 5px;
  padding: 1px 7px 2px; font: 700 15px/1 var(--f-mono); letter-spacing: .06em; white-space: nowrap; flex: none;
}
.plate small { font: 600 6.5px/1 var(--f-body); letter-spacing: .3em; margin-bottom: 1px; }
.plate.lg { font-size: 24px; padding: 3px 12px 5px; border-width: 3px; }
.plate.lg small { font-size: 9px; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 460px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { padding: 12px; display: grid; gap: 4px; }
.tile b { font: 700 30px/1 var(--f-display); }
.tile span { font-size: 13px; color: var(--muted); line-height: 1.2; }
.tile.bad b { color: var(--bad); } .tile.warn b { color: var(--warn); }

/* Pills / tags */
.pill { display: inline-flex; align-items: center; gap: 4px; font: 600 12px/1 var(--f-body); padding: 5px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--info-bg); color: var(--info); }
.tag { font: 700 11px/1 var(--f-mono); letter-spacing: .04em; padding: 6px 0; width: 42px; text-align: center; border-radius: 5px; flex: none; border: 1.5px solid currentColor; }
.tag.auditoria { color: var(--info); } .tag.preventiva { color: var(--ok); } .tag.correctiva { color: var(--warn); }
.tag.falla { color: var(--bad); } .tag.odometro { color: var(--muted); } .tag.aceite { color: var(--ink); background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Items */
.item { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: none; border: 0; width: 100%; text-align: left; cursor: pointer; }
.item:hover { background: var(--surface-2); }
.item .body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.item .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; }
.alert .sev { width: 10px; height: 10px; border-radius: 2px; margin-top: 6px; flex: none; }
.sev.bad { background: var(--bad); } .sev.warn { background: var(--warn); } .sev.info { background: var(--info); }

/* Truck card */
.truck { display: grid; gap: 10px; padding: 14px; background: none; border: 0; text-align: left; width: 100%; cursor: pointer; }
.truck:hover { background: var(--surface-2); }
.truck .top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.oilbar { height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.oilbar i { display: block; height: 100%; background: var(--ok); }
.oilbar.warn i { background: var(--warn); } .oilbar.bad i { background: var(--bad); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--info); font-weight: 600; cursor: pointer; font-size: 14px; }

/* Forms */
form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.field input, .field select, .field textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
}
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 380px) { .grid2 { grid-template-columns: 1fr; } }
.fieldset { display: grid; gap: 12px; padding: 14px; border-radius: 10px; border: 1px dashed var(--line); background: var(--surface-2); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: inline-flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-height: 44px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.typepick { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.typebtn { display: grid; gap: 8px; justify-items: start; padding: 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; font-weight: 600; font-size: 14px; line-height: 1.15; }
.typebtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }

/* Checklist */
.ck-group { display: grid; gap: 0; }
.ck-group h4 { margin: 8px 0 4px; font: 700 14px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ck { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.ck > span { min-width: 0; font-size: 15px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { min-width: 50px; min-height: 40px; border: 0; background: var(--surface); font: 700 12px/1 var(--f-body); cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-v="OK"] { background: var(--ok); color: #fff; }
.seg button[aria-pressed="true"][data-v="Obs"] { background: var(--warn); color: #fff; }
.seg button[aria-pressed="true"][data-v="Falla"] { background: var(--bad); color: #fff; }
.score { display: flex; gap: 10px; align-items: baseline; }
.score b { font: 700 28px/1 var(--f-display); }

/* Bottom nav */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar); color: var(--bar-muted);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); align-items: center; }
.nav button { background: none; border: 0; color: inherit; display: grid; justify-items: center; gap: 3px; font: 600 11px/1 var(--f-body); letter-spacing: .03em; cursor: pointer; padding: 6px 0; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--bar-ink); }
.nav button[aria-current="page"] svg { color: var(--accent); }
.nav .fab { width: 52px; height: 52px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: -18px; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.nav .fab svg { width: 28px; height: 28px; color: var(--accent-ink) !important; }

/* Sheet */
.backdrop { position: fixed; inset: 0; background: rgba(8,12,18,.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px;
}
dl.kv { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 8px 14px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: 14px; }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 14px; font-weight: 500; }
.empty { padding: 28px 18px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.empty svg { width: 64px; height: 64px; color: var(--muted); }
.confirm { display: grid; gap: 10px; padding: 12px; border-radius: 10px; background: var(--bad-bg); color: var(--bad); font-weight: 500; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
  bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 10px; font-weight: 600; font-size: 15px;
  max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
.simple .nav { display: none; }
.simple main { padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
.simple .toast { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.field input.big { min-height: 56px; font-size: 20px; font-family: var(--f-mono); }
.field input.big#ch-resp { font-family: var(--f-body); font-size: 18px; }
.sino { min-height: 60px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font: 700 22px/1 var(--f-display); letter-spacing: .04em; cursor: pointer; }
.sino[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.sino[aria-pressed="true"][data-sino="si"] { background: var(--info); border-color: var(--info); color: #fff; }
.sino[aria-pressed="true"][data-fallas="si"], .sino[aria-pressed="true"][data-opera="no"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.sheetlist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.sheetlist li { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.sheetlist .xl { font: 700 11px/1 var(--f-mono); padding: 5px 6px; border-radius: 4px; background: var(--ok-bg); color: var(--ok); }
</style>

<script>
"use strict";
/* ---------- Catálogos ---------- */
const TIPOS = {
  auditoria:  { label: "Auditoría",        code: "AUD", estado: "Cerrado" },
  preventiva: { label: "Mant. preventiva", code: "PRE", estado: "Cerrado" },
  correctiva: { label: "Mant. correctiva", code: "COR", estado: "En proceso" },
  falla:      { label: "Falla",            code: "FAL", estado: "Pendiente" },
  aceite:     { label: "Cambio de aceite", code: "ACE", estado: "Cerrado" },
  odometro:   { label: "Lectura de odómetro", code: "ODO", estado: "Cerrado" }
};
const TIPOS_CAMION = ["Camioneta frigorífica", "Camión frigorífico", "Tracto camión", "Camión rígido", "Camión tolva", "Camión aljibe", "Camión pluma", "Furgón", "Semirremolque / rampla", "Otro"];
const DOCS = [["vRevision", "Revisión técnica"], ["vPermiso", "Permiso de circulación"], ["vSoap", "SOAP"], ["vExtintor", "Extintor"]];
const ESTADOS = ["Pendiente", "En proceso", "Cerrado"];
const SISTEMAS = ["Motor", "Transmisión / Caja", "Embrague", "Frenos", "Suspensión", "Dirección", "Neumáticos", "Eléctrico", "Refrigeración", "Combustible", "Escape / DPF", "Hidráulico", "Carrocería / Cabina", "Quinta rueda / Acople", "Otro"];
const SEVERIDADES = ["Baja", "Media", "Alta", "Crítica"];

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const hoy = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const num = v => (v === "" || v == null || isNaN(Number(v))) ? null : Number(v);
const miles = n => n == null ? "—" : Number(n).toLocaleString("es-CL");
const fmtKm = n => n == null ? "—" : miles(n) + " km";
const fmtCLP = n => n ? "$" + miles(n) : "—";
const fmtFecha = s => s ? s.split("-").reverse().join("-") : "—";
const diasDesde = s => s ? Math.floor((Date.parse(hoy()) - Date.parse(s)) / 864e5) : null;
const normPatente = p => String(p || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const fmtPatente = p => (normPatente(p).match(/.{1,2}/g) || []).join("·");
const plate = (p, lg) => `<span class="plate${lg ? " lg" : ""}"><small>CHILE</small>${esc(fmtPatente(p))}</span>`;
const sget = k => { try { return localStorage.getItem(k); } catch { return null; } };
const sset = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const sdel = k => { try { localStorage.removeItem(k); } catch {} };
const EN_APK = location.protocol === "file:";
// El APK de la empresa se construye con la dirección de la planilla y el código ya puestos (ver android/construir-apk.sh)
const SERVIDOR_FIJO = "", CODIGO_FIJO = "";
const codigoAcceso = () => sget("bf_codigo") || CODIGO_FIJO;
// El link para los celulares trae el código de acceso (?c=ABC123) y, si los datos van a Google, la dirección de la planilla (?u=...)
(() => { try {
  const q = new URLSearchParams(location.search), c = q.get("c"), u = q.get("u");
  if (c) localStorage.setItem("bf_codigo", c.trim().toUpperCase());
  if (u && /^https:\/\/script\.google\.com\//.test(u)) localStorage.setItem("bf_server", u.replace(/\?.*$/, ""));

} catch {} })();

/* ---------- Almacenamiento: planilla de Google (Apps Script), computador (servidor.py), planilla compartida (claude db) o solo este teléfono ---------- */
const Store = {
  mode: "local", camiones: [], registros: [], db: null,
  outbox: [], pc: { conectado: false, codigoMal: false, pendiente: false, error: "", planilla: "", ultima: null }, syncing: false, again: false,
  async init() {
    let db = null;
    if (window.claude && typeof window.claude.use === "function") {
      try { db = await window.claude.use("db"); } catch { db = null; }
    }
    if (db) {
      this.mode = "shared"; this.db = db;
      const onErr = e => toast("Sin conexión con la planilla compartida (" + (e && e.code || "error") + ")");
      db.collection("camiones").onSnapshot(s => { this.camiones = s.docs.map(d => ({ ...d.data(), id: d.id })); if (!s.metadata.fromCache) UI.conectando = false; render(); }, onErr);
      db.collection("registros").onSnapshot(s => { this.registros = s.docs.map(d => ({ ...d.data(), id: d.id })); render(); }, onErr);
      try { const u = await window.claude.use("user"); UI.admin = u ? await u.canEdit() : false; } catch { UI.admin = false; }
      this.badge(); return;
    }
    this.cargarLocal();
    const enPC = this.base() !== null && await this.api("estado").then(r => r && r.app === "bitacora-flota").catch(() => false);
    if (enPC && !codigoAcceso()) this.pc.codigoMal = true;
    if (enPC || (this.base() !== null && (sget("bf_pc") === "1" || (EN_APK && SERVIDOR_FIJO)))) {
      // Sin señal en el primer uso igual se puede auditar: la flota de la empresa viene incluida
      if (!this.camiones.length) this.camiones = FLOTA_INICIAL.map(c => ({ ...c }));
      this.iniciarPC(); await this.sync();
    } else if (!sget("bf_data") && !sget("bf_seeded")) {
      this.camiones = FLOTA_INICIAL.map(c => ({ ...c, creado: Date.now() })); this.registros = []; sset("bf_seeded", "1"); this.persist();
    }
    if (this.mode === "local") UI.admin = sget("bf_admin_local") === "1";
    this.badge();
  },
  // Adónde se envían los datos: la planilla de Google (Apps Script), el computador con servidor.py,
  // o, si la página la entrega el mismo computador, la misma dirección ("").
  base() { return sget("bf_server") || SERVIDOR_FIJO || (EN_APK ? null : ""); },
  url(p) { return (this.base() || "") + p; },
  esGoogle(b = this.base()) { return /^https:\/\/script\.google\.com\//.test(b || ""); },
  // Las cuentas de Google Workspace entregan el link con el dominio (/a/empresa.cl/macros/s/ID/exec);
  // si ese no responde se prueba la forma general (/macros/s/ID/exec), que sirve para cualquier usuario.
  googleAlterna(u) {
    const m = /^https:\/\/script\.google\.com\/a\/(?:macros\/)?[^/]+\/(?:macros\/)?s\/([^/]+)\/exec/.exec(u || "");
    return m ? `https://script.google.com/macros/s/${m[1]}/exec` : null;
  },
  // Google Apps Script recibe todo por POST en una sola dirección; servidor.py usa una ruta por acción.
  async api(accion, cuerpo = {}, base = this.base()) {
    if (this.esGoogle(base)) {
      const cuerpoG = { accion, codigo: codigoAcceso(), ...cuerpo };
      let r;
      try { r = await this.pedir("POST", base, cuerpoG, true); }
      catch (e) {
        const alt = this.googleAlterna(base); if (!alt) throw e;
        r = await this.pedir("POST", alt, cuerpoG, true);
        if (base === this.base()) sset("bf_server", alt);
      }
      if (r && r.error === "codigo") { const e = new Error("codigo"); e.status = 401; throw e; }
      return r;
    }
    const rutas = { estado: ["GET", "api/estado"], sync: ["POST", "api/sync"], admin: ["POST", "api/admin"] };
    const [m, ruta] = rutas[accion];
    return this.pedir(m, (base || "") + ruta, m === "POST" ? cuerpo : undefined);
  },
  iniciarPC() {
    this.mode = "pc"; sset("bf_pc", "1"); UI.admin = !!sget("bf_pin");
    try { this.outbox = JSON.parse(sget("bf_outbox") || "[]"); } catch { this.outbox = []; }
    if (this._timer) return;
    this._timer = setInterval(() => this.sync(), 30000);
    window.addEventListener("online", () => this.sync());
    document.addEventListener("visibilitychange", () => { if (!document.hidden) this.sync(); });
  },
  // Acepta el link de la planilla de Google (https://script.google.com/macros/s/.../exec?c=ABC123),
  // el del computador (https://mi-flota.ngrok-free.dev/?c=ABC123) o una IP de la red local.
  async conectar(dir, codigo) {
    let u = String(dir || "").trim(); if (!u) { toast("Pega el link que aparece en la planilla (hoja Configuración)."); return; }
    try { const q = new URL(u.includes("://") ? u : "https://" + u).searchParams; if (q.get("u")) { codigo = codigo || q.get("c"); u = q.get("u"); } } catch {}
    const m = u.match(/[?&]c=([A-Za-z0-9]+)/); if (m) codigo = codigo || m[1];
    u = u.replace(/[?#].*$/, "");
    if (codigo) sset("bf_codigo", String(codigo).trim().toUpperCase());
    if (!codigoAcceso()) { toast("Escribe el código de acceso que aparece en la planilla (hoja Configuración)."); return; }
    const local = /^(https?:\/\/)?(localhost|\d{1,3}(\.\d{1,3}){3})(:|\/|$)/i.test(u);
    if (!/^https?:\/\//i.test(u)) u = (local ? "http://" : "https://") + u;
    if (!this.esGoogle(u)) {
      if (local && !/:\d+(\/|$)/.test(u.replace(/^https?:\/\//i, ""))) u = u.replace(/\/*$/, "") + ":8080";
      u = u.replace(/\/*$/, "/");
    }
    const r = await this.api("estado", {}, u).catch(() => null);
    if (!r || r.app !== "bitacora-flota") { toast("No se pudo conectar con " + u + ". Revisa que el link esté completo y que el celular tenga internet."); return; }
    if (!r.codigoOk) { this.pc.codigoMal = true; this.badge(); render(); toast("El código de acceso no es correcto. Revísalo en la planilla (hoja Configuración)."); return; }
    const antes = this.mode;
    sset("bf_server", u); this.iniciarPC();
    if (antes === "local") {
      for (const x of this.registros.filter(x => !x.ejemplo)) this.outbox.push({ col: "registros", op: "set", doc: x });
      for (const c of this.camiones.filter(x => !x.ejemplo)) this.outbox.push({ col: "camiones", op: "set", doc: c });
      sset("bf_outbox", JSON.stringify(this.outbox));
    }
    await this.sync(); toast(this.pc.conectado ? "Conectado a la planilla" : "No se pudo conectar con la planilla");
  },
  async guardarCodigo(codigo) {
    codigo = String(codigo || "").trim().toUpperCase();
    if (!codigo) { toast("Escribe el código de acceso."); return; }
    sset("bf_codigo", codigo); await this.sync();
    toast(this.pc.codigoMal ? "El código de acceso no es correcto." : "Código guardado. Conectado a la planilla.");
  },
  cargarLocal() {
    try { const raw = sget("bf_data"); if (raw) { const d = JSON.parse(raw); this.camiones = d.camiones || []; this.registros = d.registros || []; } } catch {}
  },
  // simple: sin cabeceras propias (Google Apps Script no acepta la consulta previa CORS)
  async pedir(method, url, body, simple) {
    const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 30000);
    try {
      const headers = simple ? { "Content-Type": "text/plain;charset=utf-8" } : { "X-Codigo": codigoAcceso(), "ngrok-skip-browser-warning": "1" };
      if (body && !simple) headers["Content-Type"] = "application/json";
      const r = await fetch(url, { method, signal: ac.signal, cache: "no-store", headers, body: body ? JSON.stringify(body) : undefined });
      if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
      return await r.json();
    } finally { clearTimeout(t); }
  },
  // Envía los cambios pendientes a la planilla y trae su versión completa.
  async sync() {
    if (this.mode !== "pc") return;
    if (this.syncing) { this.again = true; return; }
    this.syncing = true;
    const enviados = this.outbox.slice();
    try {
      const r = await this.api("sync", { cambios: enviados, pin: sget("bf_pin") || "" });
      if (r.rechazados) toast("Solo el administrador puede agregar o modificar camiones. Se descartaron " + r.rechazados + " cambio" + (r.rechazados === 1 ? "" : "s") + ".");
      UI.admin = !!r.admin;
      this.outbox = this.outbox.slice(enviados.length);
      const d = { camiones: [...r.datos.camiones], registros: [...r.datos.registros] };
      for (const c of this.outbox) this.aplicar(d, c);
      this.camiones = d.camiones; this.registros = d.registros;
      Object.assign(this.pc, r.planilla, { conectado: true, codigoMal: false });
      UI.conectando = false;
    } catch (e) { this.pc.conectado = false; if (e && e.status === 401) this.pc.codigoMal = true; }
    sset("bf_outbox", JSON.stringify(this.outbox)); this.persist();
    this.syncing = false; this.badge(); render();
    if (this.again) { this.again = false; if (this.outbox.length) this.sync(); }
  },
  aplicar(d, c) {
    const arr = d[c.col]; const i = arr.findIndex(x => x.id === (c.op === "set" ? c.doc.id : c.id));
    if (c.op === "set") { if (i >= 0) arr[i] = c.doc; else arr.push(c.doc); }
    else if (i >= 0) arr.splice(i, 1);
  },
  badge() {
    const m = $("#mode"); let cls = this.mode, txt;
    if (this.mode === "shared") txt = "Planilla compartida";
    else if (this.mode === "pc") {
      const n = this.outbox.length;
      if (this.pc.codigoMal) { cls = "local"; txt = "Falta código de acceso"; }
      else if (!this.pc.conectado) { cls = "local"; txt = n ? `Sin conexión · ${n} por enviar` : "Sin conexión"; }
      else if (this.pc.pendiente) { cls = "local"; txt = "PC · cierra el Excel"; }
      else { cls = "shared"; txt = this.esGoogle() ? "Planilla al día" : "PC · planilla al día"; }
    } else txt = "En este teléfono";
    m.className = "mode " + cls; m.textContent = txt;
  },
  persist() { sset("bf_data", JSON.stringify({ camiones: this.camiones, registros: this.registros })); },
  async save(col, obj) {
    if (this.mode === "shared") {
      try { await this.db.collection(col).doc(obj.id).set(JSON.parse(JSON.stringify(obj))); }
      catch (e) {
        toast(e && e.code === "invalid_argument" ? "No tienes permiso para guardar en esta planilla." : e && e.code === "quota_exceeded" ? "La planilla está llena. Exporta y borra registros antiguos." : "No se pudo guardar. Intenta de nuevo.");
        throw e;
      }
      return;
    }
    this.aplicar(this, { col, op: "set", doc: obj }); this.persist();
    if (this.mode === "pc") { this.outbox.push({ col, op: "set", doc: obj }); sset("bf_outbox", JSON.stringify(this.outbox)); this.badge(); this.sync(); }
    render();
  },
  async remove(col, id) {
    if (this.mode === "shared") { try { await this.db.collection(col).doc(id).delete(); } catch (e) { toast("No se pudo borrar."); throw e; } return; }
    this.aplicar(this, { col, op: "delete", id }); this.persist();
    if (this.mode === "pc") { this.outbox.push({ col, op: "delete", id }); sset("bf_outbox", JSON.stringify(this.outbox)); this.badge(); this.sync(); }
    render();
  }
};

/* ---------- Administrador: solo él agrega, edita y borra camiones ---------- */
function soloAdmin() {
  if (UI.admin) return true;
  toast("Solo el administrador puede hacer esto. Ingresa el PIN en Ajustes.");
  return false;
}
async function entrarAdmin(pin) {
  pin = String(pin || "").trim();
  if (Store.mode === "pc") {
    const r = await Store.api("admin", { pin }).catch(() => null);
    if (!r) { toast("No hay conexión con la planilla. Revisa la señal e intenta de nuevo."); return; }
    if (!r.ok) { toast("PIN incorrecto. Revísalo en la planilla (hoja Configuración)."); return; }
    sset("bf_pin", pin); UI.admin = true;
  } else {
    const guardado = sget("bf_pin_local");
    if (!guardado) { if (pin.length < 4) { toast("El PIN debe tener al menos 4 números."); return; } sset("bf_pin_local", pin); }
    else if (pin !== guardado) { toast("PIN incorrecto."); return; }
    sset("bf_admin_local", "1"); UI.admin = true;
  }
  toast("Modo administrador activo"); go("inicio");
}
function salirAdmin() { sdel("bf_pin"); sdel("bf_admin_local"); UI.admin = false; toast("Saliste del modo administrador"); go("chofer"); }

    { id: "ej-r6", tipo: "preventiva", camionId: "ej-c2", fecha: d(12), km: 172000, responsable: "J. Muñoz", estado: "Cerrado", servicio: "Servicio programado por km", repuestos: "Filtros, engrase", proximoKm: 187000, proximaFecha: "", costo: 120000, descripcion: "Servicio 172.000 km." },
    { id: "ej-r7", tipo: "auditoria", camionId: "ej-c2", fecha: d(3), km: 176100, responsable: "C. Pérez (supervisor)", estado: "Cerrado", proximaMant: 186000, deshielo: false, descripcion: "Neumático eje 3 lado izquierdo cerca del límite. Extintor vence el próximo mes." },
    { id: "ej-r8", tipo: "auditoria", camionId: "ej-c3", fecha: d(2), km: 402850, responsable: "C. Pérez (supervisor)", estado: "Cerrado", proximaMant: 403500, deshielo: true, descripcion: "Fuga de aire detectada, camión queda detenido." }

}

/* ---------- Cálculos ---------- */
const camion = id => Store.camiones.find(c => c.id === id);
const porFecha = (a, b) => (b.fecha || "").localeCompare(a.fecha || "") || (b.km || 0) - (a.km || 0) || (b.creado || 0) - (a.creado || 0);
// El odómetro vigente es la lectura más alta entre la ficha y los registros (así los auditores no necesitan editar la ficha).
function kmDe(c) { let m = num(c.km); for (const r of Store.registros) if (r.camionId === c.id && num(r.km) != null && (m == null || num(r.km) > m)) m = num(r.km); return m; }
function horoDe(c) { let m = num(c.horometro); for (const r of Store.registros) if (r.camionId === c.id && num(r.horometro) != null && (m == null || num(r.horometro) > m)) m = num(r.horometro); return m; }
const ordenInterno = (a, b) => (num(a.interno) ?? 1e9) - (num(b.interno) ?? 1e9) || normPatente(a.patente).localeCompare(normPatente(b.patente));
const registrosDe = id => Store.registros.filter(r => r.camionId === id).sort(porFecha);
function ultimo(id, tipo) { return registrosDe(id).find(r => r.tipo === tipo); }
function estadoAceite(c) {
  const u = ultimo(c.id, "aceite");
  if (!u || u.proximoKm == null) return { nivel: "info", texto: "Sin cambio registrado", restante: null, ultimo: u };
  const restante = u.proximoKm - (kmDe(c) ?? 0);
  const tramo = Math.max(1, u.proximoKm - (u.km || 0));
  const pct = Math.max(0, Math.min(100, (restante / tramo) * 100));
  if (restante <= 0) return { nivel: "bad", texto: "Vencido hace " + fmtKm(-restante), restante, pct: 100, ultimo: u };
  if (restante <= 1500) return { nivel: "warn", texto: "Faltan " + fmtKm(restante), restante, pct, ultimo: u };
  return { nivel: "ok", texto: "Faltan " + fmtKm(restante), restante, pct, ultimo: u };
}
function estadoDoc(f) {
  if (!f) return null;
  const d = -diasDesde(f);
  if (d < 0) return { nivel: "bad", texto: `Vencido el ${fmtFecha(f)}` };
  if (d <= 30) return { nivel: "warn", texto: `Vence en ${d} día${d === 1 ? "" : "s"} (${fmtFecha(f)})` };
  return { nivel: "ok", texto: `Vigente hasta ${fmtFecha(f)}` };
}
const abiertas = id => Store.registros.filter(r => (!id || r.camionId === id) && r.tipo === "falla" && r.estado !== "Cerrado");
function estadoCamion(c) {
  const f = abiertas(c.id);
  if (f.some(x => x.detenido)) return { nivel: "bad", texto: "Detenido" };
  const a = estadoAceite(c);
  if (f.length || a.nivel === "bad" || a.nivel === "warn" || deshieloPendiente(c) || estadoMant(c).nivel === "bad" || DOCS.some(([k]) => estadoDoc(c[k])?.nivel === "bad")) return { nivel: "warn", texto: "Revisar" };
  return { nivel: "ok", texto: "Operativo" };
}
// Próxima mantención: la que informó la última auditoría que la trae
function estadoMant(c) {
  const u = registrosDe(c.id).find(r => r.tipo === "auditoria" && num(r.proximaMant) != null);
  if (!u) return { nivel: "info", texto: "Sin dato", restante: null, km: null };
  const restante = num(u.proximaMant) - (kmDe(c) ?? 0);
  if (restante <= 0) return { nivel: "bad", texto: `Atrasada ${fmtKm(-restante)}`, restante, km: num(u.proximaMant) };
  return { nivel: restante <= AVISO_MANT_KM ? "warn" : "ok", texto: `Faltan ${fmtKm(restante)}`, restante, km: num(u.proximaMant) };
}
// La última auditoría pidió deshielo y todavía nadie lo marcó como hecho
function deshieloPendiente(c) { const a = ultimo(c.id, "auditoria"); return a && a.deshielo === true && !a.deshieloHecho ? a : null; }
function tituloRegistro(r) {
  switch (r.tipo) {
    case "auditoria": return `Auditoría${r.fallas ? ` · ${r.fallas} falla${r.fallas === 1 ? "" : "s"}` : ""} · ${r.deshielo ? (r.deshieloHecho ? "deshielo hecho" : "necesita deshielo") : "sin deshielo"}${num(r.proximaMant) != null ? " · mant. " + fmtKm(num(r.proximaMant)) : ""}`;
    case "preventiva": return r.servicio || "Mantención preventiva";
    case "correctiva": return `${r.sistema || "Correctiva"}${r.causa ? ": " + r.causa : ""}`;
    case "falla": return `Falla ${r.severidad ? r.severidad.toLowerCase() : ""} · ${r.sistema || ""}`;
    case "aceite": return `Aceite ${r.tipoAceite || ""}${r.litros ? " · " + r.litros + " L" : ""}`;
    case "odometro": return `Lectura de odómetro${r.horometro ? " · " + miles(r.horometro) + " h" : ""}`;
  }
  return TIPOS[r.tipo]?.label || r.tipo;
}
function alertas() {
  const out = [];
  for (const c of Store.camiones) {
    const a = estadoAceite(c);
    if (a.nivel === "bad" || a.nivel === "warn") out.push({ nivel: a.nivel, camion: c, texto: "Cambio de aceite: " + a.texto.toLowerCase(), accion: { tipo: "aceite", camionId: c.id } });
    if (a.nivel === "info") out.push({ nivel: "info", camion: c, texto: "Sin cambio de aceite registrado", accion: { tipo: "aceite", camionId: c.id } });
    const dh = deshieloPendiente(c);
    if (dh) out.push({ nivel: "bad", camion: c, texto: `Necesita deshielo (auditoría del ${fmtFecha(dh.fecha)})`, deshielo: dh.id });
    const mt = estadoMant(c);
    if (mt.nivel === "bad" || mt.nivel === "warn") out.push({ nivel: mt.nivel, camion: c, texto: `Mantención a los ${fmtKm(mt.km)}: ${mt.texto.toLowerCase()}`, accion: { tipo: "preventiva", camionId: c.id } });
    const au = ultimo(c.id, "auditoria"); const dd = au ? diasDesde(au.fecha) : null;
    if (!au || dd > 30) out.push({ nivel: "info", camion: c, texto: au ? `Última auditoría hace ${dd} días` : "Sin auditorías", accion: { tipo: "auditoria", camionId: c.id } });
    for (const [k, l] of DOCS) { const e = estadoDoc(c[k]); if (e && e.nivel !== "ok") out.push({ nivel: e.nivel, camion: c, texto: `${l}: ${e.texto.toLowerCase()}`, editar: c.id }); }
    const pv = ultimo(c.id, "preventiva");
    if (pv && pv.proximoKm && pv.proximoKm - (kmDe(c) ?? 0) <= 1500 && !(a.ultimo && pv.proximoKm === a.ultimo.proximoKm))
      out.push({ nivel: pv.proximoKm <= (kmDe(c) ?? 0) ? "bad" : "warn", camion: c, texto: `Preventiva (${pv.servicio || "servicio"}) a los ${fmtKm(pv.proximoKm)}`, accion: { tipo: "preventiva", camionId: c.id } });
    if (pv && pv.proximaFecha) { const dd2 = -diasDesde(pv.proximaFecha); if (dd2 <= 7) out.push({ nivel: dd2 < 0 ? "bad" : "warn", camion: c, texto: `Preventiva programada ${dd2 < 0 ? "vencida el" : "para el"} ${fmtFecha(pv.proximaFecha)}`, accion: { tipo: "preventiva", camionId: c.id } }); }
  }
  for (const f of abiertas()) {
    const c = camion(f.camionId); if (!c) continue;
    out.push({ nivel: f.severidad === "Alta" || f.severidad === "Crítica" || f.detenido ? "bad" : "warn", camion: c, texto: `Falla ${f.estado.toLowerCase()}: ${f.sistema}${f.detenido ? " · camión detenido" : ""}`, registro: f.id });
  }
  const rank = { bad: 0, warn: 1, info: 2 };
  return out.sort((a, b) => rank[a.nivel] - rank[b.nivel]);
}

const UI = { admin: false, chofer: {}, view: "chofer", camionId: null, filtro: { tipo: "", camionId: "", estado: "", q: "" }, form: null, confirm: null, conectando: true };

function go(view, extra = {}) {
  UI.view = view; Object.assign(UI, { camionId: null, confirm: null }, extra);
  if (view === "nuevo" && !extra.form) UI.form = null;
  const tab = { camion: "flota", "camion-form": "flota" }[view] || view;
  document.querySelectorAll("[data-nav]").forEach(b => b.dataset.nav === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("#app").innerHTML = ""; closeSheet(); render(); window.scrollTo(0, 0);
}

function render() {
  const app = $("#app");
  if (UI.view === "nuevo" && app.querySelector("#f-reg")) return; // no pisar un formulario en edición por cambios remotos
  if (UI.view === "camion-form" && app.querySelector("#f-cam")) return;
  if (!UI.admin && !["chofer", "ajustes"].includes(UI.view)) UI.view = "chofer";
  document.body.classList.toggle("simple", !UI.admin);
  if (UI.view === "chofer" && app.querySelector("#f-chofer")) return;
  if (UI.view === "ajustes" && app.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;

  if (tipo === "auditoria") return `<div class="fieldset">
    <label class="field"><span>Próxima mantención a los (km) *</span><input id="reg-proxmant" name="proximaMant" type="number" inputmode="numeric" min="0" value="${esc(v.proximaMant ?? (c ? estadoMant(c).km ?? "" : ""))}"></label>
    <div class="field"><span>¿Necesita deshielo? *</span><div class="checks">
      <label class="check"><input type="radio" name="deshielo" value="si" ${v.deshielo === true || v.deshielo === "si" ? "checked" : ""}> Sí</label>
      <label class="check"><input type="radio" name="deshielo" value="no" ${v.deshielo === false || v.deshielo === "no" ? "checked" : ""}> No</label></div></div></div>`;
  if (tipo === "preventiva") return `<div class="fieldset">
    <label class="field"><span>Servicio *</span>${sel("reg-servicio", "servicio", SERVICIOS, v.servicio, true)}</label>
    <label class="field"><span>Repuestos / insumos</span><input id="reg-repuestos" name="repuestos" value="${esc(v.repuestos || "")}"></label>
    <div class="grid2"><label class="field"><span>Próximo a los (km)</span><input id="reg-proxkm" name="proximoKm" type="number" inputmode="numeric" value="${esc(v.proximoKm ?? "")}"></label>
    <label class="field"><span>Próxima fecha</span><input id="reg-proxfecha" name="proximaFecha" type="date" value="${esc(v.proximaFecha || "")}"></label></div></div>`;
  if (tipo === "correctiva") return `<div class="fieldset">
    <label class="field"><span>Sistema *</span>${sel("reg-sistema", "sistema", SISTEMAS, v.sistema, true)}</label>
    <label class="field"><span>Causa / diagnóstico</span><input id="reg-causa" name="causa" value="${esc(v.causa || "")}"></label>
    <label class="field"><span>Repuestos cambiados</span><input id="reg-repuestos" name="repuestos" value="${esc(v.repuestos || "")}"></label>
    <div class="grid2"><label class="field"><span>Horas de taller</span><input id="reg-horas" name="horas" type="number" inputmode="decimal" step="0.5" min="0" value="${esc(v.horas ?? "")}"></label>
    <label class="field"><span>Taller</span>${sel("reg-taller", "taller", ["Interno", "Externo", "Concesionario"], v.taller)}</label></div></div>`;
  if (tipo === "falla") return `<div class="fieldset">
    <div class="grid2"><label class="field"><span>Sistema *</span>${sel("reg-sistema", "sistema", SISTEMAS, v.sistema, true)}</label>
    <label class="field"><span>Severidad *</span>${sel("reg-sev", "severidad", SEVERIDADES, v.severidad, true)}</label></div>
    <label class="check"><input type="checkbox" id="reg-detenido" name="detenido" ${v.detenido ? "checked" : ""}> Camión detenido (fuera de servicio)</label></div>`;
  if (tipo === "odometro") return `<div class="fieldset">
    <label class="field"><span>Horómetro (h)</span><input id="reg-horometro" name="horometro" type="number" inputmode="decimal" step="0.1" min="0" value="${esc(v.horometro ?? (c ? horoDe(c) ?? "" : ""))}"></label></div>`;
  if (tipo === "aceite") {
    const km = num(v.km ?? (c ? kmDe(c) : null)); const prox = v.proximoKm ?? (km != null && c ? km + (c.intervalo || 15000) : "");
    return `<div class="fieldset">
    <div class="grid2"><label class="field"><span>Aceite *</span><input id="reg-aceite" name="tipoAceite" list="dl-aceites" required value="${esc(v.tipoAceite || "")}" placeholder="15W-40"></label>
    <label class="field"><span>Litros</span><input id="reg-litros" name="litros" type="number" inputmode="decimal" step="0.5" min="0" value="${esc(v.litros ?? "")}"></label></div>
    <div class="field"><span>Filtros cambiados</span><div class="checks">${FILTROS.map(([k, l]) => `<label class="check"><input type="checkbox" id="reg-${k}" name="${k}" ${v[k] ?? (k === "fAceite") ? "checked" : ""}> ${l}</label>`).join("")}</div></div>

function leerFormRegistro() {
  const f = $("#f-reg"); if (!f) return UI.form || {};
  const fd = new FormData(f); const v = { ...(UI.form || {}) };
  for (const [k, val] of fd.entries()) v[k] = val;
  f.querySelectorAll("input[type=checkbox]").forEach(cb => { v[cb.name] = cb.checked; });
  if (!v.tipo) v.tipo = "auditoria";
  return v;
}

function wireRegistroForm() {
  const f = $("#f-reg"); if (!f) return;
  f.addEventListener("click", e => {
    const tb = e.target.closest(".typebtn");
    if (tb) { const v = leerFormRegistro(); v.tipo = tb.dataset.tipo; delete v.estado; if (v.proximoKm != null && tb.dataset.tipo === "aceite") delete v.proximoKm; UI.form = v; $("#app").innerHTML = vNuevo(); wireRegistroForm(); return; }
  });
  const selC = $("#reg-camion"), km = $("#reg-km");
  selC.addEventListener("change", () => { const c = camion(selC.value); if (c && (!km.value || km.dataset.auto !== "0")) { km.value = kmDe(c) ?? ""; km.dataset.auto = "1"; } autoProx(); });
  km.addEventListener("input", () => { km.dataset.auto = "0"; autoProx(); });
  const prox = $("#reg-proxkm"); if (prox) prox.addEventListener("input", () => { prox.dataset.auto = "0"; });
  function autoProx() { const p = $("#reg-proxkm"); const c = camion(selC.value); if (p && p.dataset.auto === "1" && $("#reg-aceite") && c && km.value) p.value = Number(km.value) + (c.intervalo || 15000); }
  f.addEventListener("submit", guardarRegistro);
}

async function guardarRegistro(e) {
  e.preventDefault();
  const v = leerFormRegistro(); const c = camion(v.camionId);
  const falta = [];
  if (!c) falta.push("camión"); if (!v.fecha) falta.push("fecha"); if (num(v.km) == null) falta.push("kilometraje");
  if (v.tipo === "preventiva" && !v.servicio) falta.push("servicio");
  if ((v.tipo === "correctiva" || v.tipo === "falla") && !v.sistema) falta.push("sistema");
  if (v.tipo === "falla" && !v.severidad) falta.push("severidad");
  if (v.tipo === "aceite" && !v.tipoAceite) falta.push("tipo de aceite");
  if (v.tipo === "auditoria" && num(v.proximaMant) == null) falta.push("próxima mantención");
  if (v.tipo === "auditoria" && !["si", "no", true, false].includes(v.deshielo)) falta.push("si necesita deshielo");
  if (falta.length) { toast("Falta completar: " + falta.join(", ")); return; }
  if (v.tipo === "odometro" && !v.id && num(v.km) < (kmDe(c) ?? 0)) { toast(`La lectura es menor que el odómetro actual (${fmtKm(kmDe(c))}).`); return; }
  const r = { ...v, id: v.id || uid(), creado: v.creado || Date.now(), km: num(v.km), costo: num(v.costo), litros: num(v.litros), horas: num(v.horas), horometro: num(v.horometro), proximoKm: num(v.proximoKm), proximaMant: num(v.proximaMant), patente: normPatente(c.patente) };
  if (r.tipo === "auditoria") r.deshielo = r.deshielo === "si" || r.deshielo === true; else { delete r.deshielo; delete r.proximaMant; }
  if (r.estado === "Cerrado" && !r.cerrado) r.cerrado = hoy();
  if (r.estado !== "Cerrado") delete r.cerrado;
  delete r.ejemplo;
  delete r.checklist;
  if (r.responsable) sset("bf_resp", r.responsable);
  try { await Store.save("registros", r); } catch { return; }
  UI.form = null; toast(v.id ? "Registro actualizado" : "Registro guardado");
  go("camion", { camionId: c.id });
}

function wireCamionForm() {
  const f = $("#f-cam"); if (!f) return;
  ["#cam-patente", "#cam-vin", "#cam-motor"].forEach(sel => { const p = $(sel); p.addEventListener("input", () => { const pos = p.selectionStart; p.value = p.value.toUpperCase(); p.setSelectionRange(pos, pos); }); });
  f.addEventListener("submit", async e => {
    e.preventDefault();
    if (!soloAdmin()) return;
    const fd = Object.fromEntries(new FormData(f).entries());
    const pat = normPatente(fd.patente);
    if (pat.length < 5) { toast("Ingresa una patente válida (ej. KZRT41)."); return; }
    const prev = UI.camionId ? camion(UI.camionId) : null;
    if (Store.camiones.some(x => normPatente(x.patente) === pat && (!prev || x.id !== prev.id))) { toast("Ya existe un camión con la patente " + fmtPatente(pat) + "."); return; }
    const c = { ...(prev || {}), id: prev ? prev.id : uid(), creado: prev?.creado || Date.now() };
    for (const [k, v] of Object.entries(fd)) c[k] = NUM_CAMION.includes(k) ? num(v) : String(v).trim();
    c.patente = pat; c.intervalo = c.intervalo || 15000;
    delete c.ejemplo;
    try { await Store.save("camiones", c); } catch { return; }
    toast(prev ? "Camión actualizado" : "Camión agregado"); go("camion", { camionId: c.id });
  });
}

// Guarda lo escrito en el formulario del chofer antes de redibujarlo (al agregar o quitar fallas)
function leerChofer() {
  const ch = UI.chofer; if (!$("#f-chofer")) return ch;
  ch.km = $("#ch-km").value; ch.mant = $("#ch-mant").value; ch.resp = $("#ch-resp").value;
  (ch.fallas || []).forEach((f, i) => { const s = $("#ch-fs-" + i), d = $("#ch-fd-" + i); if (s) f.sistema = s.value; if (d) f.desc = d.value; });
  return ch;
}
function redibujarChofer() { const y = window.scrollY; $("#app").innerHTML = vChofer(); window.scrollTo(0, y); }

async function enviarChofer(e) {
  e.preventDefault();
  const c = camion(UI.chofer.camionId); if (!c) return;
  const ch = leerChofer();
  const km = num(ch.km), mant = num(ch.mant), resp = String(ch.resp || "").trim(), dh = ch.deshielo;
  const fallas = ch.tieneFallas ? (ch.fallas || []).map(f => ({ sistema: f.sistema, desc: String(f.desc || "").trim() })) : [];
  const falta = [];
  if (km == null) falta.push("odómetro"); if (mant == null) falta.push("próxima mantención"); if (!resp) falta.push("responsable"); if (dh !== true && dh !== false) falta.push("si necesita deshielo");
  if (ch.tieneFallas !== true && ch.tieneFallas !== false) falta.push("si tiene fallas");
  if (ch.tieneFallas && fallas.some(f => !f.sistema)) falta.push("qué falla");
  if (ch.tieneFallas && ch.opera !== true && ch.opera !== false) falta.push("si puede seguir trabajando");
  if (falta.length) { toast("Falta completar: " + falta.join(", ")); return; }
  if (km < (kmDe(c) ?? 0)) { toast(`El odómetro no puede ser menor que el último registrado (${fmtKm(kmDe(c))}). Revisa el número.`); return; }
  sset("bf_resp", resp);
  const resumen = fallas.map(f => f.sistema + (f.desc ? ": " + f.desc : "")).join("; ");
  const r = { id: uid(), creado: Date.now(), tipo: "auditoria", camionId: c.id, patente: normPatente(c.patente), fecha: hoy(), km, proximaMant: mant, responsable: resp, deshielo: dh,
    fallas: fallas.length, fallasResumen: resumen, estado: "Cerrado", cerrado: hoy(), descripcion: "" };
  try {
    await Store.save("registros", r);
    // Cada falla queda también como registro propio, para seguirla hasta repararla
    for (const f of fallas) await Store.save("registros", { id: uid(), creado: Date.now(), tipo: "falla", camionId: c.id, patente: r.patente, fecha: r.fecha, km, responsable: resp,
      sistema: f.sistema, severidad: ch.opera ? "Media" : "Alta", detenido: !ch.opera, estado: "Pendiente", descripcion: f.desc, auditoriaId: r.id, origen: "Auditoría" });
  } catch { return; }
  UI.chofer = { enviado: { camionId: c.id, fallas: fallas.length } }; $("#app").innerHTML = ""; render(); window.scrollTo(0, 0);
}

/* ---------- Excel ---------- */
async function guardarArchivo(filename, data) {
  if (window.AndroidApp && typeof window.AndroidApp.guardarArchivo === "function") {
    const buf = new Uint8Array(await data.arrayBuffer()); let bin = "";
    for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    toast(window.AndroidApp.guardarArchivo(filename, btoa(bin)));
    return;
  }
  let dl = null;
  if (window.claude && typeof window.claude.use === "function") { try { dl = await window.claude.use("downloads"); } catch { dl = null; } }
  if (dl) {
    try { await dl.save({ filename, data }); toast("Archivo guardado"); }
    catch (e) { toast(e && e.code === "declined" ? "Descarga cancelada" : "No se pudo descargar en esta vista."); }
    return;
  }
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Archivo descargado");
}

function hoja(rows, headers) {
  const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [Object.fromEntries(headers.map(h => [h, ""]))], { header: headers });
  ws["!cols"] = headers.map(h => ({ wch: Math.min(48, Math.max(h.length + 2, ...rows.map(r => String(r[h] ?? "").length + 1))) }));
  if (rows.length) ws["!autofilter"] = { ref: ws["!ref"] };
  return ws;
}

  }), flotaH), "Flota");

  const audH = ["Fecha", "N° interno", "Patente", "Vehículo", "Odómetro (km)", "Próxima mantención (km)", "Km para mantención", "Responsable", "Necesita deshielo", "Deshielo realizado", "Fallas reportadas", "Detalle de fallas"];
  XLSX.utils.book_append_sheet(wb, hoja(regs.filter(r => r.tipo === "auditoria").map(r => {
    const c = camion(r.camionId) || {};
    return { "Fecha": r.fecha, "N° interno": c.interno || "", "Patente": pat(r), "Vehículo": [c.marca, c.modelo].filter(Boolean).join(" "), "Odómetro (km)": r.km,
      "Próxima mantención (km)": num(r.proximaMant) ?? "", "Km para mantención": num(r.proximaMant) != null && r.km != null ? num(r.proximaMant) - r.km : "",
      "Responsable": r.responsable, "Necesita deshielo": r.deshielo ? "Sí" : "No", "Deshielo realizado": r.deshieloHecho || "", "Fallas reportadas": r.fallas || 0, "Detalle de fallas": r.fallasResumen || "" };
  }), audH), "Auditorías");

  const preH = ["Fecha", "Patente", "Km", "Responsable", "Servicio", "Repuestos", "Próximo (km)", "Próxima fecha", "Costo CLP", "Estado", "Observaciones"];
  XLSX.utils.book_append_sheet(wb, hoja(regs.filter(r => r.tipo === "preventiva").map(r => ({ ...base(r), "Responsable": r.responsable, "Servicio": r.servicio, "Repuestos": r.repuestos, "Próximo (km)": r.proximoKm ?? "", "Próxima fecha": r.proximaFecha || "", "Costo CLP": r.costo ?? "", "Estado": r.estado, "Observaciones": r.descripcion })), preH), "Preventivas");

  const corH = ["Fecha", "Patente", "Km", "Responsable", "Sistema", "Causa", "Repuestos", "Horas taller", "Taller", "Costo CLP", "Estado", "Fecha cierre", "Observaciones"];
  XLSX.utils.book_append_sheet(wb, hoja(regs.filter(r => r.tipo === "correctiva").map(r => ({ ...base(r), "Responsable": r.responsable, "Sistema": r.sistema, "Causa": r.causa, "Repuestos": r.repuestos, "Horas taller": r.horas ?? "", "Taller": r.taller, "Costo CLP": r.costo ?? "", "Estado": r.estado, "Fecha cierre": r.cerrado || "", "Observaciones": r.descripcion })), corH), "Correctivas");

  const falH = ["Fecha", "N° interno", "Patente", "Km", "Reportado por", "Origen", "Sistema", "Severidad", "Camión detenido", "Estado", "Fecha cierre", "Descripción"];
  XLSX.utils.book_append_sheet(wb, hoja(regs.filter(r => r.tipo === "falla").map(r => ({ ...base(r), "N° interno": camion(r.camionId)?.interno || "", "Origen": r.origen || "Registro", "Reportado por": r.responsable, "Sistema": r.sistema, "Severidad": r.severidad, "Camión detenido": sn(r.detenido), "Estado": r.estado, "Fecha cierre": r.cerrado || "", "Descripción": r.descripcion })), falH), "Fallas");

  const aceH = ["Fecha", "Patente", "Km", "Responsable", "Aceite", "Litros", ...FILTROS.map(([, l]) => l), "Próximo cambio (km)", "Costo CLP", "Observaciones"];
  XLSX.utils.book_append_sheet(wb, hoja(regs.filter(r => r.tipo === "aceite").map(r => ({ ...base(r), "Responsable": r.responsable, "Aceite": r.tipoAceite, "Litros": r.litros ?? "", ...Object.fromEntries(FILTROS.map(([k, l]) => [l, sn(r[k])])), "Próximo cambio (km)": r.proximoKm ?? "", "Costo CLP": r.costo ?? "", "Observaciones": r.descripcion })), aceH), "Cambios de aceite");

  const odoH = ["Fecha", "Patente", "Km", "Horómetro (h)", "Responsable", "Observaciones"];
  XLSX.utils.book_append_sheet(wb, hoja(regs.filter(r => r.tipo === "odometro").map(r => ({ ...base(r), "Horómetro (h)": r.horometro ?? "", "Responsable": r.responsable, "Observaciones": r.descripcion })), odoH), "Odómetro");

  const allH = ["Fecha", "Tipo", "Patente", "Km", "Responsable", "Detalle", "Estado", "Costo CLP", "Observaciones"];
  XLSX.utils.book_append_sheet(wb, hoja(regs.map(r => ({ "Fecha": r.fecha, "Tipo": TIPOS[r.tipo]?.label, "Patente": pat(r), "Km": r.km, "Responsable": r.responsable, "Detalle": tituloRegistro(r), "Estado": r.estado, "Costo CLP": r.costo ?? "", "Observaciones": r.descripcion })), allH), "Todos los registros");

  const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  await guardarArchivo(`Bitacora_Flota_${hoy()}.xlsx`, new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
}

async function importarJSON(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.camiones) || !Array.isArray(d.registros)) throw new Error("formato");
    for (const c of d.camiones) await Store.save("camiones", c);
    for (const r of d.registros) await Store.save("registros", r);
    toast(`Respaldo restaurado: ${d.camiones.length} camiones, ${d.registros.length} registros`);
  } catch { toast("El archivo no es un respaldo válido de Bitácora de Flota."); }
}

/* ---------- Eventos ---------- */
document.addEventListener("click", async e => {
  const nav = e.target.closest("[data-nav]"); if (nav) { go(nav.dataset.nav); return; }
  const nl = e.target.closest("[data-nav-link]"); if (nl) { go(!UI.admin && nl.dataset.navLink === "planilla" ? "ajustes" : nl.dataset.navLink); return; }
  const fb = e.target.closest("[data-fallas]");
  if (fb) { const ch = leerChofer(); ch.tieneFallas = fb.dataset.fallas === "si"; if (ch.tieneFallas && !(ch.fallas || []).length) ch.fallas = [{}]; redibujarChofer(); return; }
  const op = e.target.closest("[data-opera]"); if (op) { UI.chofer.opera = op.dataset.opera === "si"; document.querySelectorAll("[data-opera]").forEach(b => b.setAttribute("aria-pressed", b === op)); return; }
  const sino = e.target.closest("[data-sino]"); if (sino) { UI.chofer.deshielo = sino.dataset.sino === "si"; document.querySelectorAll("[data-sino]").forEach(b => b.setAttribute("aria-pressed", b === sino)); return; }
  const ft = e.target.closest("[data-filtro-tipo]"); if (ft) { UI.filtro.tipo = ft.dataset.filtroTipo; render(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case "cerrar": if (e.target === el || el.tagName === "BUTTON") closeSheet(); break;
    case "ver-reg": verRegistro(id); break;
    case "chofer-camion": UI.chofer = { camionId: id }; $("#app").innerHTML = ""; render(); window.scrollTo(0, 0); break;
    case "falla-otra": { const ch = leerChofer(); ch.fallas = [...(ch.fallas || []), {}]; redibujarChofer(); break; }
    case "falla-quitar": { const ch = leerChofer(); ch.fallas.splice(Number(el.dataset.i), 1); redibujarChofer(); break; }
    case "chofer-volver": UI.chofer = {}; $("#app").innerHTML = ""; render(); break;
    case "chofer-otra": UI.chofer = {}; go("chofer"); break;
    case "chofer-inicio": go(UI.admin ? "inicio" : "chofer"); break;
    case "deshielo-hecho": {
      if (!soloAdmin()) break;
      const r = Store.registros.find(x => x.id === id); if (!r) break;
      try { await Store.save("registros", { ...r, deshieloHecho: hoy() }); toast("Deshielo marcado como realizado"); closeSheet(); render(); } catch {} break;
    }
    case "ver-camion": go("camion", { camionId: id }); break;
    case "nuevo-camion": if (!soloAdmin()) break; go("camion-form"); break;
    case "editar-camion": if (!soloAdmin()) break; go("camion-form", { camionId: id }); break;
    case "volver-camion": UI.camionId ? go("camion", { camionId: UI.camionId }) : go("flota"); break;
    case "registrar": go("nuevo", { form: { tipo: el.dataset.tipo || "auditoria", camionId: el.dataset.camion || "" } }); break;
    case "limpiar": UI.form = { tipo: (UI.form && UI.form.tipo) || leerFormRegistro().tipo }; $("#app").innerHTML = vNuevo(); wireRegistroForm(); break;
    case "cancelar-edicion": { const cid = UI.form?.camionId; UI.form = null; go(cid ? "camion" : "historial", cid ? { camionId: cid } : {}); break; }
    case "editar-reg": { const r = Store.registros.find(x => x.id === id); if (r) go("nuevo", { form: JSON.parse(JSON.stringify(r)) }); break; }
    case "borrar-reg": $("#confirm-reg").innerHTML = `<div class="confirm">¿Borrar este registro? No se puede deshacer.<div class="grid2"><button class="btn" data-act="no-borrar-reg">Cancelar</button><button class="btn danger solid" data-act="borrar-reg-ok" data-id="${esc(id)}">Sí, borrar</button></div></div>`; break;
    case "no-borrar-reg": $("#confirm-reg").innerHTML = ""; break;
    case "borrar-reg-ok": try { await Store.remove("registros", id); closeSheet(); toast("Registro borrado"); render(); } catch {} break;
    case "estado": {
      const r = Store.registros.find(x => x.id === id); if (!r) break;
      const n = { ...r, estado: el.dataset.estado }; if (n.estado === "Cerrado") n.cerrado = n.cerrado || hoy(); else delete n.cerrado;
      try { await Store.save("registros", n); toast("Estado: " + n.estado); verRegistro(id); } catch {} break;
    }
    case "borrar-camion": if (!soloAdmin()) break; UI.confirm = "camion"; render(); break;
    case "cancelar": UI.confirm = null; render(); break;
    case "borrar-camion-ok": if (!soloAdmin()) break; try { for (const r of registrosDe(id)) await Store.remove("registros", r.id); await Store.remove("camiones", id); toast("Camión borrado"); go("flota"); } catch {} break;
    case "borrar-ejemplos": if (!soloAdmin()) break; try { for (const r of Store.registros.filter(x => x.ejemplo)) await Store.remove("registros", r.id); for (const c of Store.camiones.filter(x => x.ejemplo)) await Store.remove("camiones", c.id); toast("Ejemplos borrados"); render(); } catch {} break;
    case "cargar-ejemplos": if (!soloAdmin()) break; { const s = ejemplo(); try { for (const c of s.camiones) await Store.save("camiones", c); for (const r of s.registros) await Store.save("registros", r); toast("Ejemplo cargado"); } catch {} break; }
    case "excel": exportarExcel(); break;
    case "admin-entrar": entrarAdmin($("#admin-pin").value); break;
    case "admin-salir": salirAdmin(); break;
    case "conectar": Store.conectar($("#srv-url").value, $("#srv-codigo").value); break;
    case "codigo": Store.guardarCodigo($("#srv-codigo").value); break;
    case "sync": await Store.sync(); toast(Store.pc.conectado ? "Planilla al día" : "No se pudo conectar con la planilla"); break;
    case "respaldo": guardarArchivo(`Bitacora_Flota_respaldo_${hoy()}.json`, new Blob([JSON.stringify({ app: "bitacora-flota", version: 1, exportado: new Date().toISOString(), camiones: Store.camiones, registros: Store.registros }, null, 1)], { type: "application/json" })); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "ch-q") { UI.chofer.q = e.target.value; clearTimeout(UI._q); UI._q = setTimeout(() => { $("#app").innerHTML = ""; render(); const q = $("#ch-q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 200); return; }
  const f = e.target.closest("[data-filtro]"); if (!f) return;
  UI.filtro[f.dataset.filtro] = f.value;
  if (f.dataset.filtro === "q") { clearTimeout(UI._q); UI._q = setTimeout(() => { render(); const q = $("#fil-q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 250); }
  else render();
});
document.addEventListener("change", e => { if (e.target.id === "imp-json" && e.target.files[0]) { importarJSON(e.target.files[0]); e.target.value = ""; } });
document.addEventListener("submit", e => { if (e.target.id === "f-chofer") enviarChofer(e); });
document.addEventListener("submit", async e => {
  if (e.target.id !== "f-odo") return;
  e.preventDefault();
  const c = camion(UI.camionId); if (!c) return;
  const km = num($("#odo-km").value), h = num($("#odo-h").value);
  if (km == null && h == null) { toast("Ingresa la lectura del odómetro."); return; }
  if (km != null && km < (kmDe(c) ?? 0)) { toast(`La lectura es menor que la actual (${fmtKm(kmDe(c))}). Revisa el número.`); return; }
  const r = { id: uid(), creado: Date.now(), tipo: "odometro", camionId: c.id, patente: normPatente(c.patente), fecha: hoy(), km: km ?? kmDe(c), horometro: h, responsable: sget("bf_resp") || "", estado: "Cerrado", descripcion: "" };
  try { await Store.save("registros", r); } catch { return; }
  toast("Odómetro actualizado: " + fmtKm(r.km));
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// Botón "atrás" de Android: cierra la hoja abierta o vuelve al inicio antes de salir de la app.
window.appAtras = () => {
  if ($("#overlay").innerHTML) { closeSheet(); return true; }
  if (UI.view !== "inicio") { go(UI.view === "camion" || UI.view === "camion-form" ? "flota" : "inicio"); return true; }
  return false;
};

/* ---------- Inicio ---------- */
render();
Store.init().then(() => { if (Store.mode === "local") UI.conectando = false; if (UI.admin && UI.view === "chofer") UI.view = "inicio"; render(); });
if ("serviceWorker" in navigator && !window.claude && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
<!--APP-END-->
</body>
</html>
